# Hot-reload stack: edit code locally, containers pick up changes.
# Run: docker compose -f docker-compose.dev.yml up --build    Open: http://localhost:5173

services:
  postgres:
    image: postgres:16-alpine
    container_name: forya_postgres_dev
    environment:
      POSTGRES_USER: forya
      POSTGRES_PASSWORD: foryasecret
      POSTGRES_DB: foryadb
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forya -d foryadb"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - forya-dev-net

  backend:
    image: node:20-alpine
    container_name: forya_backend_dev
    working_dir: /app
    # Installs, syncs the schema, loads the starter catalogue + demo account, then hot-reloads.
    command: sh -c "apk add --no-cache openssl >/dev/null && npm install && npx prisma db push && npm run seed && npm run dev"
    environment:
      PORT: 4000
      NODE_ENV: development
      DATABASE_URL: "postgresql://forya:foryasecret@postgres:5432/foryadb?schema=public"
      JWT_SECRET: "change-me-in-dev"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend_modules:/app/node_modules
    ports:
      - "${API_PORT:-4000}:4000"
    restart: unless-stopped
    networks:
      - forya-dev-net

  frontend:
    image: node:20-alpine
    container_name: forya_frontend_dev
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_TARGET: http://backend:4000
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules
    ports:
      - "${DEV_WEB_PORT:-5173}:5173"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - forya-dev-net

volumes:
  pgdata_dev:
  backend_modules:
  frontend_modules:

networks:
  forya-dev-net:
    driver: bridge